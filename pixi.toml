[package]
name = "pillow"
version = "12.3.0.dev0"

[package.build.backend]
name = "pixi-build-python"
version = "0.5.*"

[package.build.config]
# Pillow has C extensions: build per-platform, not noarch.
noarch = false
compilers = ["c", "cxx"]

[package.host-dependencies]
python = "*"
setuptools = ">=77"
wheel = "*"
pybind11 = "*"
zlib = "*"
libjpeg-turbo = "*"
